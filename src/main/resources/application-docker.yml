# Used by docker-compose: PostgreSQL + Redis-backed Spring Cache.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/flightdb}
  cache:
    type: redis
    redis:
      time-to-live: 60s
      key-prefix: "fbs::"
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
management:
  health:
    redis:
      enabled: true
  server:
    port: ${MANAGEMENT_PORT:8081}   # actuator on its own port, so it can be kept off the public network
logging:
  structured:
    format:
      console: ecs                # JSON lines; MDC (correlationId) is included
