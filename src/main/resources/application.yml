spring:
  application:
    name: flight-booking-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flightdb}
    username: ${DB_USERNAME:flight}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates it
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple                  # in-memory; the 'docker' profile switches to Redis
    cache-names: flightSearch,routeSearch
  data:
    redis:
      repositories:
        enabled: false
  mvc:
    format:
      date: iso
      date-time: iso
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints.web.exposure.include: health,info
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:}        # required; the dev profile has a throwaway default
    expiration-minutes: 120
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}   # required; the dev profile has a throwaway default
  booking:
    hold-minutes: 10
    max-passengers: 9
    hold-expiry-check-ms: 30000
  cache:
    search-eviction-ms: 60000
  outbox:
    relay-ms: 1000
  scheduling:
    enabled: true
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@flightbooking.local}
    admin-password: ${SEED_ADMIN_PASSWORD:}

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-none}]"
  level:
    com.kunal.flightbooking: INFO
