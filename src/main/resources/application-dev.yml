# 'dev' = load seed data (Indian airports, airlines, routes, 7 days of schedules).
app:
  jwt:
    # Throwaway key so `dev` boots without setup. Never used outside the dev profile.
    secret: ${JWT_SECRET:dev-only-insecure-signing-key-override-with-JWT_SECRET-env}
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret-override-with-PAYMENT_WEBHOOK_SECRET}
  seed:
    enabled: true
logging:
  level:
    com.kunal.flightbooking: DEBUG
