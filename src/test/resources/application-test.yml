spring:
  datasource:
    url: jdbc:h2:mem:flightdb_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 30
  cache:
    type: simple
app:
  jwt:
    secret: test-only-signing-key-used-by-the-automated-test-suite-0123456789
  scheduling:
    enabled: false   # tests trigger HoldExpiryScheduler explicitly
logging:
  level:
    com.kunal.flightbooking: INFO
    org.hibernate.SQL: WARN
