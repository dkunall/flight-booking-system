# Datasource comes from the Testcontainers PostgreSQL in IntegrationTestBase (@ServiceConnection).
spring:
  datasource:
    hikari:
      maximum-pool-size: 30
  cache:
    type: simple
app:
  jwt:
    secret: test-only-signing-key-used-by-the-automated-test-suite-0123456789
  payments:
    webhook-secret: test-only-webhook-secret-used-by-the-test-suite-0123
  scheduling:
    enabled: false   # tests trigger the schedulers explicitly
logging:
  level:
    com.kunal.flightbooking: INFO
    org.hibernate.SQL: WARN
